<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>AR·DOOH Project Logos</title>
  <style>
    body { background: #eeeae4; font-family: monospace; display: flex; flex-wrap: wrap; gap: 48px; padding: 60px; justify-content: center; }
    .card { display: flex; flex-direction: column; align-items: center; gap: 12px; }
    .label { color: #999; font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; }
  </style>
</head>
<body>

<!-- ── Option 1: Camera Lens + City ── -->
<div class="card">
  <svg width="220" height="220" viewBox="0 0 220 220" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="p1sky" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" style="stop-color:#ddf0ff"/>
        <stop offset="100%" style="stop-color:#ffffff"/>
      </linearGradient>
    </defs>
    <rect width="220" height="220" fill="white" rx="20"/>

    <!-- Outer lens ring -->
    <circle cx="110" cy="100" r="72" fill="url(#p1sky)" stroke="#1a2e4a" stroke-width="2.5"/>
    <!-- Inner lens ring -->
    <circle cx="110" cy="100" r="56" fill="none" stroke="#1a2e4a" stroke-width="1.2" opacity="0.3"/>
    <!-- Lens glare -->
    <ellipse cx="88" cy="78" rx="10" ry="6" fill="white" opacity="0.5" transform="rotate(-30 88 78)"/>

    <!-- NYC skyline inside lens -->
    <clipPath id="lensClip">
      <circle cx="110" cy="100" r="70"/>
    </clipPath>
    <g clip-path="url(#lensClip)">
      <!-- Sky gradient inside -->
      <rect x="40" y="40" width="140" height="130" fill="#e8f4ff" opacity="0.6"/>
      <!-- Buildings -->
      <rect x="48"  y="112" width="12" height="58" fill="#1a2e4a" opacity="0.7"/>
      <rect x="62"  y="100" width="10" height="70" fill="#1a2e4a" opacity="0.8"/>
      <rect x="74"  y="88"  width="8"  height="82" fill="#1a2e4a"/>
      <!-- WTC twin -->
      <rect x="85"  y="60"  width="10" height="110" fill="#1a2e4a"/>
      <rect x="97"  y="60"  width="10" height="110" fill="#1a2e4a" opacity="0.9"/>
      <!-- ESB stepped -->
      <rect x="110" y="72"  width="14" height="98" fill="#1a2e4a"/>
      <rect x="112" y="62"  width="10" height="12" fill="#1a2e4a"/>
      <rect x="114" y="54"  width="6"  height="10" fill="#1a2e4a"/>
      <line x1="117" y1="54" x2="117" y2="44" stroke="#1a2e4a" stroke-width="2"/>
      <!-- More buildings -->
      <rect x="127" y="95"  width="11" height="75" fill="#1a2e4a" opacity="0.8"/>
      <rect x="140" y="108" width="9"  height="62" fill="#1a2e4a" opacity="0.7"/>
      <rect x="151" y="118" width="12" height="52" fill="#1a2e4a" opacity="0.6"/>
      <!-- Ground -->
      <rect x="40" y="168" width="140" height="20" fill="#1a2e4a" opacity="0.9"/>
    </g>

    <!-- Lens crosshair -->
    <line x1="110" y1="32" x2="110" y2="50" stroke="#1a2e4a" stroke-width="1.5" opacity="0.4"/>
    <line x1="110" y1="150" x2="110" y2="168" stroke="#1a2e4a" stroke-width="1.5" opacity="0.4"/>
    <line x1="42" y1="100" x2="60" y2="100" stroke="#1a2e4a" stroke-width="1.5" opacity="0.4"/>
    <line x1="160" y1="100" x2="178" y2="100" stroke="#1a2e4a" stroke-width="1.5" opacity="0.4"/>

    <!-- Text -->
    <text x="110" y="188" text-anchor="middle" fill="#1a2e4a" font-size="16" font-weight="900" font-family="sans-serif" letter-spacing="4">AR·DOOH</text>
    <text x="110" y="203" text-anchor="middle" fill="#1a2e4a" font-size="7.5" font-family="sans-serif" letter-spacing="3" opacity="0.45">NYC LANDMARK DETECTION</text>
  </svg>
  <span class="label">01 — Lens</span>
</div>

<!-- ── Option 2: Wordmark + Skyline bar ── -->
<div class="card">
  <svg width="220" height="220" viewBox="0 0 220 220" xmlns="http://www.w3.org/2000/svg">
    <rect width="220" height="220" fill="white" rx="20"/>

    <!-- Top accent bar -->
    <rect x="30" y="30" width="160" height="3" fill="#1a2e4a"/>

    <!-- Big wordmark -->
    <text x="110" y="95" text-anchor="middle" fill="#1a2e4a" font-size="42" font-weight="900" font-family="sans-serif" letter-spacing="-1">AR</text>
    <!-- Dot divider -->
    <circle cx="110" cy="108" r="4" fill="#2a7fff"/>
    <!-- DOOH below -->
    <text x="110" y="136" text-anchor="middle" fill="#1a2e4a" font-size="28" font-weight="300" font-family="sans-serif" letter-spacing="8">DOOH</text>

    <!-- Skyline silhouette bar -->
    <path d="M30,165 L30,155 L42,155 L42,148 L50,148 L50,140 L56,140 L56,132 L60,132 L60,126 L63,126 L63,120 L66,120 L66,126 L70,126 L70,138 L76,138 L76,130 L80,130 L80,123 L84,123 L84,116 L88,116 L88,110 L110,110 L110,116 L114,116 L114,123 L118,123 L118,130 L122,130 L122,138 L128,138 L128,126 L132,126 L132,120 L135,120 L135,126 L138,126 L138,132 L144,132 L144,140 L150,140 L150,148 L158,148 L158,155 L170,155 L170,165 Z"
      fill="#1a2e4a" opacity="0.08"/>
    <path d="M30,165 L30,155 L42,155 L42,148 L50,148 L50,140 L56,140 L56,132 L60,132 L60,126 L63,126 L63,120 L66,120 L66,126 L70,126 L70,138 L76,138 L76,130 L80,130 L80,123 L84,123 L84,116 L88,116 L88,110 L110,110 L110,116 L114,116 L114,123 L118,123 L118,130 L122,130 L122,138 L128,138 L128,126 L132,126 L132,120 L135,120 L135,126 L138,126 L138,132 L144,132 L144,140 L150,140 L150,148 L158,148 L158,155 L170,155 L170,165"
      fill="none" stroke="#2a7fff" stroke-width="1.5"/>

    <!-- Bottom accent bar -->
    <rect x="30" y="185" width="160" height="1.5" fill="#1a2e4a" opacity="0.2"/>

    <text x="110" y="200" text-anchor="middle" fill="#2a7fff" font-size="7" font-family="sans-serif" letter-spacing="4" opacity="0.7">NYC LANDMARK DETECTION</text>
  </svg>
  <span class="label">02 — Wordmark</span>
</div>

<!-- ── Option 3: Phone + AR frame ── -->
<div class="card">
  <svg width="220" height="220" viewBox="0 0 220 220" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="p3grad" x1="0%" y1="0%" x2="135%" y2="100%">
        <stop offset="0%" style="stop-color:#2a7fff"/>
        <stop offset="100%" style="stop-color:#00c8ff"/>
      </linearGradient>
    </defs>
    <rect width="220" height="220" fill="white" rx="20"/>

    <!-- Phone outline -->
    <rect x="72" y="22" width="76" height="130" rx="10" fill="#f0f5ff" stroke="#1a2e4a" stroke-width="2.5"/>
    <!-- Phone screen -->
    <rect x="78" y="34" width="64" height="96" rx="4" fill="#ddeeff"/>
    <!-- Phone notch -->
    <rect x="100" y="26" width="20" height="5" rx="2.5" fill="#1a2e4a" opacity="0.3"/>
    <!-- Phone home bar -->
    <rect x="98" y="140" width="24" height="4" rx="2" fill="#1a2e4a" opacity="0.2"/>

    <!-- AR brackets inside screen -->
    <polyline points="84,40 80,40 80,46"   fill="none" stroke="url(#p3grad)" stroke-width="2" stroke-linecap="round"/>
    <polyline points="136,40 140,40 140,46" fill="none" stroke="url(#p3grad)" stroke-width="2" stroke-linecap="round"/>
    <polyline points="84,122 80,122 80,116" fill="none" stroke="url(#p3grad)" stroke-width="2" stroke-linecap="round"/>
    <polyline points="136,122 140,122 140,116" fill="none" stroke="url(#p3grad)" stroke-width="2" stroke-linecap="round"/>

    <!-- Building inside screen -->
    <rect x="96"  y="70" width="8"  height="52" fill="#1a2e4a" opacity="0.7"/>
    <rect x="106" y="58" width="8"  height="64" fill="#1a2e4a"/>
    <rect x="116" y="76" width="8"  height="46" fill="#1a2e4a" opacity="0.7"/>
    <line x1="110" y1="58" x2="110" y2="50" stroke="#1a2e4a" stroke-width="1.5"/>
    <!-- Scan line -->
    <line x1="80" y1="90" x2="140" y2="90" stroke="url(#p3grad)" stroke-width="1.5" opacity="0.6" stroke-dasharray="4 3"/>

    <!-- Text -->
    <text x="110" y="178" text-anchor="middle" fill="#1a2e4a" font-size="16" font-weight="900" font-family="sans-serif" letter-spacing="3">AR·DOOH</text>
    <text x="110" y="194" text-anchor="middle" fill="#2a7fff" font-size="7.5" font-family="sans-serif" letter-spacing="3" opacity="0.6">LANDMARK DETECTION</text>
  </svg>
  <span class="label">03 — Phone AR</span>
</div>

<!-- ── Option 4: Abstract A mark ── -->
<div class="card">
  <svg width="220" height="220" viewBox="0 0 220 220" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="p4grad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" style="stop-color:#1a2e4a"/>
        <stop offset="100%" style="stop-color:#2a7fff"/>
      </linearGradient>
    </defs>
    <rect width="220" height="220" fill="white" rx="20"/>

    <!-- Abstract A shape made of city buildings -->
    <!-- Left leg of A -->
    <polygon points="40,165 68,165 82,90 68,90" fill="url(#p4grad)"/>
    <!-- Right leg of A -->
    <polygon points="152,165 180,165 152,90 138,90" fill="url(#p4grad)"/>
    <!-- Crossbar (The Edge platform style) -->
    <rect x="72" y="118" width="76" height="14" fill="url(#p4grad)"/>
    <!-- Peak spire -->
    <polygon points="96,90 110,28 124,90" fill="url(#p4grad)"/>
    <!-- White cutouts for windows -->
    <rect x="55"  y="130" width="6" height="8" fill="white" opacity="0.6" rx="1"/>
    <rect x="55"  y="148" width="6" height="8" fill="white" opacity="0.6" rx="1"/>
    <rect x="156" y="130" width="6" height="8" fill="white" opacity="0.6" rx="1"/>
    <rect x="156" y="148" width="6" height="8" fill="white" opacity="0.6" rx="1"/>
    <rect x="103" y="55"  width="5" height="6" fill="white" opacity="0.5" rx="1"/>
    <rect x="103" y="67"  width="5" height="6" fill="white" opacity="0.5" rx="1"/>

    <!-- Text -->
    <text x="110" y="190" text-anchor="middle" fill="#1a2e4a" font-size="14" font-weight="900" font-family="sans-serif" letter-spacing="5">AR · DOOH</text>
    <text x="110" y="206" text-anchor="middle" fill="#2a7fff" font-size="7" font-family="sans-serif" letter-spacing="3" opacity="0.6">NYC LANDMARK DETECTION</text>
  </svg>
  <span class="label">04 — A Mark</span>
</div>

<!-- ── Option 5: Location pin + skyline ── -->
<div class="card">
  <svg width="220" height="220" viewBox="0 0 220 220" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="p5grad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" style="stop-color:#2a7fff"/>
        <stop offset="100%" style="stop-color:#0044cc"/>
      </linearGradient>
      <clipPath id="pinClip">
        <path d="M110,20 C85,20 64,41 64,66 C64,100 110,148 110,148 C110,148 156,100 156,66 C156,41 135,20 110,20 Z"/>
      </clipPath>
    </defs>
    <rect width="220" height="220" fill="white" rx="20"/>

    <!-- Pin shadow -->
    <ellipse cx="110" cy="158" rx="22" ry="6" fill="#1a2e4a" opacity="0.1"/>

    <!-- Pin body fill -->
    <path d="M110,20 C85,20 64,41 64,66 C64,100 110,148 110,148 C110,148 156,100 156,66 C156,41 135,20 110,20 Z"
      fill="url(#p5grad)"/>

    <!-- Skyline inside pin -->
    <g clip-path="url(#pinClip)">
      <rect x="64" y="90" width="92" height="60" fill="#0044cc" opacity="0.4"/>
      <rect x="72"  y="100" width="8"  height="50" fill="white" opacity="0.3"/>
      <rect x="82"  y="88"  width="8"  height="62" fill="white" opacity="0.4"/>
      <rect x="93"  y="62"  width="9"  height="88" fill="white" opacity="0.5"/>
      <rect x="104" y="62"  width="9"  height="88" fill="white" opacity="0.45"/>
      <rect x="115" y="74"  width="10" height="76" fill="white" opacity="0.4"/>
      <rect x="117" y="64"  width="6"  height="12" fill="white" opacity="0.4"/>
      <rect x="119" y="56"  width="2"  height="10" fill="white" opacity="0.4"/>
      <rect x="127" y="90"  width="8"  height="60" fill="white" opacity="0.3"/>
      <rect x="137" y="100" width="8"  height="50" fill="white" opacity="0.25"/>
    </g>

    <!-- Pin outline -->
    <path d="M110,20 C85,20 64,41 64,66 C64,100 110,148 110,148 C110,148 156,100 156,66 C156,41 135,20 110,20 Z"
      fill="none" stroke="#0044cc" stroke-width="2"/>

    <!-- Inner circle -->
    <circle cx="110" cy="66" r="14" fill="none" stroke="white" stroke-width="2" opacity="0.6"/>
    <circle cx="110" cy="66" r="4" fill="white" opacity="0.8"/>

    <!-- Text -->
    <text x="110" y="180" text-anchor="middle" fill="#1a2e4a" font-size="17" font-weight="900" font-family="sans-serif" letter-spacing="3">AR·DOOH</text>
    <text x="110" y="196" text-anchor="middle" fill="#2a7fff" font-size="7.5" font-family="sans-serif" letter-spacing="3" opacity="0.6">NYC LANDMARK DETECTION</text>
  </svg>
  <span class="label">05 — Location Pin</span>
</div>

</body>
</html>
