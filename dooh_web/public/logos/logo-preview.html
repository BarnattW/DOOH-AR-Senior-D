<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>AR·DOOH Logo Options</title>
  <style>
    body { background: #0a0a0a; font-family: monospace; display: flex; flex-wrap: wrap; gap: 40px; padding: 40px; }
    .card { display: flex; flex-direction: column; align-items: center; gap: 12px; }
    .label { color: #555; font-size: 12px; letter-spacing: 0.2em; text-transform: uppercase; }
  </style>
</head>
<body>

<!-- ── Logo 1: AR Brackets + Skyline ── -->
<div class="card">
  <svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
    <!-- Corner brackets -->
    <polyline points="20,40 20,20 40,20" fill="none" stroke="#00f0ff" stroke-width="3" stroke-linecap="square"/>
    <polyline points="160,20 180,20 180,40" fill="none" stroke="#00f0ff" stroke-width="3" stroke-linecap="square"/>
    <polyline points="20,160 20,180 40,180" fill="none" stroke="#00f0ff" stroke-width="3" stroke-linecap="square"/>
    <polyline points="160,180 180,180 180,160" fill="none" stroke="#00f0ff" stroke-width="3" stroke-linecap="square"/>
    <!-- Skyline silhouette -->
    <path d="M30,145 L30,110 L45,110 L45,95 L55,95 L55,85 L65,85 L65,75 L70,75 L70,65 L75,65 L75,75 L80,75 L80,95 L90,95 L90,80 L95,80 L95,70 L100,62 L105,70 L105,80 L110,80 L110,95 L120,95 L120,85 L130,85 L130,100 L140,100 L140,110 L155,110 L155,90 L165,90 L165,145 Z"
      fill="#00f0ff" opacity="0.15"/>
    <path d="M30,145 L30,110 L45,110 L45,95 L55,95 L55,85 L65,85 L65,75 L70,75 L70,65 L75,65 L75,75 L80,75 L80,95 L90,95 L90,80 L95,80 L95,70 L100,62 L105,70 L105,80 L110,80 L110,95 L120,95 L120,85 L130,85 L130,100 L140,100 L140,110 L155,110 L155,90 L165,90 L165,145"
      fill="none" stroke="#00f0ff" stroke-width="1.5"/>
    <!-- Text -->
    <text x="100" y="170" text-anchor="middle" fill="#00f0ff" font-size="18" font-weight="900" font-family="monospace" letter-spacing="4">AR·DOOH</text>
  </svg>
  <span class="label">01 — Skyline</span>
</div>

<!-- ── Logo 2: Targeting Reticle ── -->
<div class="card">
  <svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
    <!-- Outer ring -->
    <circle cx="100" cy="95" r="60" fill="none" stroke="#00f0ff" stroke-width="1.5" stroke-dasharray="8 4" opacity="0.5"/>
    <!-- Inner ring -->
    <circle cx="100" cy="95" r="35" fill="none" stroke="#00f0ff" stroke-width="2"/>
    <!-- Crosshair lines -->
    <line x1="100" y1="25" x2="100" y2="55" stroke="#00f0ff" stroke-width="2"/>
    <line x1="100" y1="135" x2="100" y2="165" stroke="#00f0ff" stroke-width="2"/>
    <line x1="30" y1="95" x2="60" y2="95" stroke="#00f0ff" stroke-width="2"/>
    <line x1="140" y1="95" x2="170" y2="95" stroke="#00f0ff" stroke-width="2"/>
    <!-- Building inside -->
    <rect x="88" y="72" width="6" height="30" fill="#00f0ff"/>
    <rect x="96" y="65" width="8" height="37" fill="#00f0ff"/>
    <rect x="106" y="78" width="6" height="24" fill="#00f0ff"/>
    <!-- Center dot -->
    <circle cx="100" cy="95" r="3" fill="#00f0ff"/>
    <!-- Text -->
    <text x="100" y="182" text-anchor="middle" fill="#00f0ff" font-size="14" font-weight="700" font-family="monospace" letter-spacing="3">AR·DOOH</text>
  </svg>
  <span class="label">02 — Reticle</span>
</div>

<!-- ── Logo 3: Letter A with building ── -->
<div class="card">
  <svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="g3" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" style="stop-color:#00f0ff"/>
        <stop offset="100%" style="stop-color:#0088aa"/>
      </linearGradient>
    </defs>
    <!-- Large A -->
    <path d="M100,25 L145,140 L130,140 L120,115 L80,115 L70,140 L55,140 Z" fill="none" stroke="url(#g3)" stroke-width="3" stroke-linejoin="round"/>
    <line x1="83" y1="102" x2="117" y2="102" stroke="url(#g3)" stroke-width="3"/>
    <!-- Building inside A -->
    <rect x="95" y="60" width="4" height="30" fill="#00f0ff" opacity="0.8"/>
    <rect x="101" y="52" width="4" height="38" fill="#00f0ff"/>
    <rect x="107" y="68" width="4" height="22" fill="#00f0ff" opacity="0.8"/>
    <!-- R letter -->
    <text x="148" y="90" fill="#00f0ff" font-size="52" font-weight="900" font-family="monospace" opacity="0.9">R</text>
    <!-- Subtext -->
    <text x="100" y="168" text-anchor="middle" fill="#00f0ff" font-size="11" font-family="monospace" letter-spacing="5" opacity="0.7">LANDMARK DETECT</text>
  </svg>
  <span class="label">03 — Lettermark</span>
</div>

<!-- ── Logo 4: Hexagon + building ── -->
<div class="card">
  <svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
    <!-- Hexagon -->
    <polygon points="100,20 165,57.5 165,132.5 100,170 35,132.5 35,57.5"
      fill="none" stroke="#00f0ff" stroke-width="2"/>
    <polygon points="100,32 153,62.5 153,122.5 100,153 47,122.5 47,62.5"
      fill="none" stroke="#00f0ff" stroke-width="1" opacity="0.3"/>
    <!-- NYC skyline inside hex -->
    <g transform="translate(55, 70)">
      <!-- Empire State -->
      <rect x="5" y="25" width="10" height="35" fill="#00f0ff" opacity="0.9"/>
      <rect x="7" y="15" width="6" height="12" fill="#00f0ff" opacity="0.9"/>
      <rect x="9" y="8" width="2" height="9" fill="#00f0ff" opacity="0.9"/>
      <!-- WTC -->
      <rect x="30" y="10" width="9" height="50" fill="#00f0ff"/>
      <rect x="41" y="10" width="9" height="50" fill="#00f0ff" opacity="0.8"/>
      <!-- The Edge platform -->
      <rect x="60" y="30" width="18" height="30" fill="#00f0ff" opacity="0.9"/>
      <rect x="58" y="26" width="22" height="6" fill="#00f0ff"/>
    </g>
    <text x="100" y="185" text-anchor="middle" fill="#00f0ff" font-size="13" font-weight="700" font-family="monospace" letter-spacing="4">AR·DOOH</text>
  </svg>
  <span class="label">04 — Hexagon</span>
</div>

<!-- ── Logo 5: Eye / Lens ── -->
<div class="card">
  <svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <clipPath id="eyeClip">
        <path d="M20,95 Q100,30 180,95 Q100,160 20,95 Z"/>
      </clipPath>
    </defs>
    <!-- Eye outline -->
    <path d="M20,95 Q100,30 180,95 Q100,160 20,95 Z"
      fill="none" stroke="#00f0ff" stroke-width="2.5"/>
    <!-- Iris -->
    <circle cx="100" cy="95" r="32" fill="none" stroke="#00f0ff" stroke-width="2"/>
    <circle cx="100" cy="95" r="18" fill="#00f0ff" opacity="0.1"/>
    <!-- Pupil building -->
    <g clip-path="url(#eyeClip)">
      <rect x="91" y="72" width="5" height="30" fill="#00f0ff" opacity="0.9"/>
      <rect x="98" y="65" width="6" height="37" fill="#00f0ff"/>
      <rect x="106" y="76" width="5" height="26" fill="#00f0ff" opacity="0.9"/>
    </g>
    <!-- Scan lines -->
    <line x1="20" y1="88" x2="180" y2="88" stroke="#00f0ff" stroke-width="0.5" opacity="0.3"/>
    <line x1="20" y1="102" x2="180" y2="102" stroke="#00f0ff" stroke-width="0.5" opacity="0.3"/>
    <!-- Corner HUD marks -->
    <polyline points="20,75 20,65 30,65" fill="none" stroke="#00f0ff" stroke-width="1.5" opacity="0.6"/>
    <polyline points="170,65 180,65 180,75" fill="none" stroke="#00f0ff" stroke-width="1.5" opacity="0.6"/>
    <polyline points="20,115 20,125 30,125" fill="none" stroke="#00f0ff" stroke-width="1.5" opacity="0.6"/>
    <polyline points="170,125 180,125 180,115" fill="none" stroke="#00f0ff" stroke-width="1.5" opacity="0.6"/>
    <text x="100" y="175" text-anchor="middle" fill="#00f0ff" font-size="14" font-weight="700" font-family="monospace" letter-spacing="4">AR·DOOH</text>
  </svg>
  <span class="label">05 — Eye / Lens</span>
</div>

</body>
</html>
