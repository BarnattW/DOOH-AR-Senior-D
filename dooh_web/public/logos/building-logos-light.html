<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Building Logos — Light Theme</title>
  <style>
    body { background: #f0ede8; font-family: monospace; display: flex; flex-wrap: wrap; gap: 60px; padding: 60px; justify-content: center; }
    .card { display: flex; flex-direction: column; align-items: center; gap: 14px; }
    .label { color: #999; font-size: 11px; letter-spacing: 0.25em; text-transform: uppercase; }
  </style>
</head>
<body>

<!-- ── The Edge — Warm Terracotta ── -->
<div class="card">
  <svg width="220" height="220" viewBox="0 0 220 220" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="edgeLight" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" style="stop-color:#c0440a"/>
        <stop offset="100%" style="stop-color:#e8783a"/>
      </linearGradient>
    </defs>
    <rect width="220" height="220" fill="#fff8f4" rx="16"/>
    <!-- Subtle background circle -->
    <circle cx="110" cy="95" r="72" fill="#f5ddd0" opacity="0.6"/>

    <!-- Corner brackets -->
    <polyline points="18,42 18,18 42,18" fill="none" stroke="#c0440a" stroke-width="2" stroke-linecap="square" opacity="0.35"/>
    <polyline points="178,18 202,18 202,42" fill="none" stroke="#c0440a" stroke-width="2" stroke-linecap="square" opacity="0.35"/>
    <polyline points="18,178 18,202 42,202" fill="none" stroke="#c0440a" stroke-width="2" stroke-linecap="square" opacity="0.35"/>
    <polyline points="178,202 202,202 202,178" fill="none" stroke="#c0440a" stroke-width="2" stroke-linecap="square" opacity="0.35"/>

    <!-- Tower -->
    <rect x="86" y="46" width="26" height="112" fill="url(#edgeLight)" opacity="0.12" rx="1"/>
    <rect x="86" y="46" width="26" height="112" fill="none" stroke="url(#edgeLight)" stroke-width="2" rx="1"/>

    <!-- Cantilever platform -->
    <rect x="62" y="88" width="74" height="13" fill="url(#edgeLight)" opacity="0.15" rx="1"/>
    <rect x="62" y="88" width="74" height="13" fill="none" stroke="#c0440a" stroke-width="2.5" rx="1"/>

    <!-- Support struts -->
    <line x1="86"  y1="101" x2="68"  y2="118" stroke="#c0440a" stroke-width="1.5" opacity="0.4"/>
    <line x1="112" y1="101" x2="130" y2="118" stroke="#c0440a" stroke-width="1.5" opacity="0.4"/>

    <!-- Windows -->
    <rect x="92" y="56"  width="6" height="5" fill="#c0440a" opacity="0.35" rx="0.5"/>
    <rect x="100" y="56" width="6" height="5" fill="#c0440a" opacity="0.35" rx="0.5"/>
    <rect x="92" y="68"  width="6" height="5" fill="#c0440a" opacity="0.35" rx="0.5"/>
    <rect x="100" y="68" width="6" height="5" fill="#c0440a" opacity="0.35" rx="0.5"/>
    <rect x="92" y="108" width="6" height="5" fill="#c0440a" opacity="0.35" rx="0.5"/>
    <rect x="100" y="108" width="6" height="5" fill="#c0440a" opacity="0.35" rx="0.5"/>
    <rect x="92" y="120" width="6" height="5" fill="#c0440a" opacity="0.35" rx="0.5"/>
    <rect x="100" y="120" width="6" height="5" fill="#c0440a" opacity="0.35" rx="0.5"/>

    <!-- Ground line -->
    <line x1="55" y1="158" x2="165" y2="158" stroke="#c0440a" stroke-width="2" opacity="0.3"/>

    <!-- Text -->
    <text x="110" y="178" text-anchor="middle" fill="#c0440a" font-size="15" font-weight="900" font-family="monospace" letter-spacing="4">THE EDGE</text>
    <text x="110" y="194" text-anchor="middle" fill="#c0440a" font-size="8" font-family="monospace" letter-spacing="3" opacity="0.45">HUDSON YARDS · NYC</text>
  </svg>
  <span class="label">The Edge</span>
</div>

<!-- ── One WTC — Steel Blue ── -->
<div class="card">
  <svg width="220" height="220" viewBox="0 0 220 220" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="wtcLight" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" style="stop-color:#0a4a7a"/>
        <stop offset="100%" style="stop-color:#1a7fc4"/>
      </linearGradient>
    </defs>
    <rect width="220" height="220" fill="#f0f6ff" rx="16"/>
    <!-- Background circle -->
    <circle cx="110" cy="95" r="72" fill="#d8eaf8" opacity="0.5"/>

    <!-- Grid lines -->
    <line x1="40" y1="110" x2="180" y2="110" stroke="#1a7fc4" stroke-width="0.5" opacity="0.2"/>
    <line x1="110" y1="30"  x2="110" y2="160" stroke="#1a7fc4" stroke-width="0.5" opacity="0.2"/>

    <!-- Tapered tower -->
    <polygon points="82,158 79,130 87,92 93,64 100,40 117,64 123,92 131,130 128,158"
      fill="url(#wtcLight)" opacity="0.1"/>
    <polygon points="82,158 79,130 87,92 93,64 100,40 117,64 123,92 131,130 128,158"
      fill="none" stroke="url(#wtcLight)" stroke-width="2.5"/>

    <!-- Antenna -->
    <line x1="110" y1="40" x2="110" y2="22" stroke="#0a4a7a" stroke-width="2.5"/>
    <circle cx="110" cy="20" r="3" fill="#0a4a7a"/>

    <!-- Floor bands -->
    <line x1="89"  y1="115" x2="131" y2="115" stroke="#1a7fc4" stroke-width="0.8" opacity="0.35"/>
    <line x1="87"  y1="130" x2="133" y2="130" stroke="#1a7fc4" stroke-width="0.8" opacity="0.35"/>
    <line x1="91"  y1="100" x2="129" y2="100" stroke="#1a7fc4" stroke-width="0.8" opacity="0.35"/>
    <line x1="93"  y1="85"  x2="127" y2="85"  stroke="#1a7fc4" stroke-width="0.8" opacity="0.35"/>

    <!-- AR scan bracket -->
    <polyline points="55,52 40,52 40,68"   fill="none" stroke="#1a7fc4" stroke-width="1.5" opacity="0.3"/>
    <polyline points="165,52 180,52 180,68" fill="none" stroke="#1a7fc4" stroke-width="1.5" opacity="0.3"/>

    <!-- Ground -->
    <line x1="55" y1="158" x2="165" y2="158" stroke="#0a4a7a" stroke-width="2" opacity="0.25"/>

    <!-- Text -->
    <text x="110" y="178" text-anchor="middle" fill="#0a4a7a" font-size="14" font-weight="900" font-family="monospace" letter-spacing="3">ONE WTC</text>
    <text x="110" y="194" text-anchor="middle" fill="#1a7fc4" font-size="8" font-family="monospace" letter-spacing="3" opacity="0.5">WORLD TRADE CENTER</text>
  </svg>
  <span class="label">One WTC</span>
</div>

<!-- ── Empire State — Warm Stone ── -->
<div class="card">
  <svg width="220" height="220" viewBox="0 0 220 220" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="esbLight" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" style="stop-color:#5a3e00"/>
        <stop offset="100%" style="stop-color:#a07020"/>
      </linearGradient>
    </defs>
    <rect width="220" height="220" fill="#fdf8ee" rx="16"/>
    <!-- Background circle -->
    <circle cx="110" cy="95" r="72" fill="#f0e4c0" opacity="0.5"/>

    <!-- Art deco border -->
    <rect x="12" y="12" width="196" height="196" fill="none" stroke="#a07020" stroke-width="0.75" opacity="0.3" rx="14"/>

    <!-- Stepped ESB silhouette -->
    <!-- Base -->
    <rect x="52"  y="138" width="116" height="20" fill="url(#esbLight)" opacity="0.1" rx="1"/>
    <rect x="52"  y="138" width="116" height="20" fill="none" stroke="url(#esbLight)" stroke-width="2" rx="1"/>
    <!-- Step 2 -->
    <rect x="66"  y="116" width="88" height="24" fill="url(#esbLight)" opacity="0.1" rx="1"/>
    <rect x="66"  y="116" width="88" height="24" fill="none" stroke="url(#esbLight)" stroke-width="2" rx="1"/>
    <!-- Step 3 -->
    <rect x="78"  y="98"  width="64" height="20" fill="url(#esbLight)" opacity="0.1" rx="1"/>
    <rect x="78"  y="98"  width="64" height="20" fill="none" stroke="url(#esbLight)" stroke-width="2" rx="1"/>
    <!-- Step 4 -->
    <rect x="88"  y="80"  width="44" height="20" fill="url(#esbLight)" opacity="0.1" rx="1"/>
    <rect x="88"  y="80"  width="44" height="20" fill="none" stroke="url(#esbLight)" stroke-width="2" rx="1"/>
    <!-- Step 5 -->
    <rect x="97"  y="64"  width="26" height="18" fill="url(#esbLight)" opacity="0.1" rx="1"/>
    <rect x="97"  y="64"  width="26" height="18" fill="none" stroke="url(#esbLight)" stroke-width="2" rx="1"/>
    <!-- Broadcast tower -->
    <rect x="108" y="38"  width="5" height="26" fill="url(#esbLight)" rx="1"/>
    <rect x="109.5" y="28" width="2" height="12" fill="#5a3e00"/>
    <circle cx="110.5" cy="27" r="2.5" fill="#a07020"/>

    <!-- Art deco ornament lines -->
    <line x1="66"  y1="136" x2="154" y2="136" stroke="#a07020" stroke-width="0.75" opacity="0.35"/>
    <line x1="78"  y1="116" x2="142" y2="116" stroke="#a07020" stroke-width="0.75" opacity="0.35"/>
    <line x1="88"  y1="98"  x2="132" y2="98"  stroke="#a07020" stroke-width="0.75" opacity="0.35"/>

    <!-- Windows -->
    <rect x="82"  y="122" width="5" height="5" fill="#a07020" opacity="0.4" rx="0.5"/>
    <rect x="92"  y="122" width="5" height="5" fill="#a07020" opacity="0.4" rx="0.5"/>
    <rect x="123" y="122" width="5" height="5" fill="#a07020" opacity="0.4" rx="0.5"/>
    <rect x="133" y="122" width="5" height="5" fill="#a07020" opacity="0.4" rx="0.5"/>
    <rect x="84"  y="104" width="5" height="5" fill="#a07020" opacity="0.4" rx="0.5"/>
    <rect x="94"  y="104" width="5" height="5" fill="#a07020" opacity="0.4" rx="0.5"/>
    <rect x="121" y="104" width="5" height="5" fill="#a07020" opacity="0.4" rx="0.5"/>
    <rect x="131" y="104" width="5" height="5" fill="#a07020" opacity="0.4" rx="0.5"/>

    <!-- Text -->
    <text x="110" y="178" text-anchor="middle" fill="#5a3e00" font-size="11" font-weight="700" font-family="serif" letter-spacing="5">EMPIRE STATE</text>
    <text x="110" y="194" text-anchor="middle" fill="#a07020" font-size="8" font-family="serif" letter-spacing="4" opacity="0.55">BUILDING · 1931</text>
  </svg>
  <span class="label">Empire State Building</span>
</div>

</body>
</html>
