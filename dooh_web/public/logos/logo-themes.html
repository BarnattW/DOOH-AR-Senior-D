<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>AR·DOOH Logo Themes</title>
  <style>
    body { background: #111; font-family: monospace; display: flex; flex-wrap: wrap; gap: 48px; padding: 48px; }
    .card { display: flex; flex-direction: column; align-items: center; gap: 12px; }
    .label { color: #555; font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; }
  </style>
</head>
<body>

<!-- ── Theme 1: Neon Retro (80s pink/purple) ── -->
<div class="card">
  <svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <filter id="glow1">
        <feGaussianBlur stdDeviation="3" result="blur"/>
        <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
      <linearGradient id="retro" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" style="stop-color:#ff2d78"/>
        <stop offset="100%" style="stop-color:#bf5fff"/>
      </linearGradient>
    </defs>
    <rect width="200" height="200" fill="#0d0010"/>
    <!-- Grid lines -->
    <line x1="0" y1="150" x2="200" y2="150" stroke="#bf5fff" stroke-width="0.5" opacity="0.4"/>
    <line x1="0" y1="160" x2="200" y2="160" stroke="#bf5fff" stroke-width="0.5" opacity="0.3"/>
    <line x1="0" y1="170" x2="200" y2="170" stroke="#bf5fff" stroke-width="0.5" opacity="0.2"/>
    <!-- Perspective grid -->
    <line x1="100" y1="150" x2="0" y2="200" stroke="#bf5fff" stroke-width="0.5" opacity="0.3"/>
    <line x1="100" y1="150" x2="50" y2="200" stroke="#bf5fff" stroke-width="0.5" opacity="0.3"/>
    <line x1="100" y1="150" x2="100" y2="200" stroke="#bf5fff" stroke-width="0.5" opacity="0.3"/>
    <line x1="100" y1="150" x2="150" y2="200" stroke="#bf5fff" stroke-width="0.5" opacity="0.3"/>
    <line x1="100" y1="150" x2="200" y2="200" stroke="#bf5fff" stroke-width="0.5" opacity="0.3"/>
    <!-- Skyline silhouette -->
    <path d="M30,150 L30,110 L50,110 L50,90 L60,90 L60,70 L68,70 L68,55 L72,55 L72,45 L76,45 L76,55 L80,55 L80,80 L90,80 L90,65 L95,65 L95,55 L100,48 L105,55 L105,65 L110,65 L110,80 L120,80 L120,95 L132,95 L132,85 L140,85 L140,110 L160,110 L160,95 L170,95 L170,150 Z"
      fill="url(#retro)" opacity="0.2" filter="url(#glow1)"/>
    <path d="M30,150 L30,110 L50,110 L50,90 L60,90 L60,70 L68,70 L68,55 L72,55 L72,45 L76,45 L76,55 L80,55 L80,80 L90,80 L90,65 L95,65 L95,55 L100,48 L105,55 L105,65 L110,65 L110,80 L120,80 L120,95 L132,95 L132,85 L140,85 L140,110 L160,110 L160,95 L170,95 L170,150"
      fill="none" stroke="url(#retro)" stroke-width="2" filter="url(#glow1)"/>
    <!-- Text -->
    <text x="100" y="185" text-anchor="middle" fill="url(#retro)" font-size="20" font-weight="900" font-family="monospace" letter-spacing="3" filter="url(#glow1)">AR·DOOH</text>
  </svg>
  <span class="label">01 — Neon Retro</span>
</div>

<!-- ── Theme 2: Gold / Luxury ── -->
<div class="card">
  <svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="gold" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" style="stop-color:#f5d67a"/>
        <stop offset="50%" style="stop-color:#c9952a"/>
        <stop offset="100%" style="stop-color:#f5d67a"/>
      </linearGradient>
    </defs>
    <rect width="200" height="200" fill="#080808"/>
    <!-- Thin outer border -->
    <rect x="10" y="10" width="180" height="180" fill="none" stroke="url(#gold)" stroke-width="0.75" opacity="0.5"/>
    <rect x="16" y="16" width="168" height="168" fill="none" stroke="url(#gold)" stroke-width="0.5" opacity="0.3"/>
    <!-- Crown / spire motif -->
    <path d="M100,28 L108,50 L120,42 L115,62 L130,58 L120,75 L80,75 L70,58 L85,62 L80,42 L92,50 Z"
      fill="none" stroke="url(#gold)" stroke-width="1.5" stroke-linejoin="round"/>
    <!-- Building column -->
    <rect x="88" y="75" width="24" height="70" fill="none" stroke="url(#gold)" stroke-width="1.5"/>
    <!-- Windows -->
    <rect x="92" y="82" width="6" height="5" fill="url(#gold)" opacity="0.6"/>
    <rect x="102" y="82" width="6" height="5" fill="url(#gold)" opacity="0.6"/>
    <rect x="92" y="93" width="6" height="5" fill="url(#gold)" opacity="0.6"/>
    <rect x="102" y="93" width="6" height="5" fill="url(#gold)" opacity="0.6"/>
    <rect x="92" y="104" width="6" height="5" fill="url(#gold)" opacity="0.6"/>
    <rect x="102" y="104" width="6" height="5" fill="url(#gold)" opacity="0.6"/>
    <!-- Baseline -->
    <line x1="40" y1="145" x2="160" y2="145" stroke="url(#gold)" stroke-width="0.75"/>
    <!-- Text -->
    <text x="100" y="162" text-anchor="middle" fill="url(#gold)" font-size="13" font-weight="400" font-family="serif" letter-spacing="6">AR · DOOH</text>
    <text x="100" y="177" text-anchor="middle" fill="url(#gold)" font-size="7" font-family="serif" letter-spacing="4" opacity="0.6">LANDMARK DETECTION</text>
  </svg>
  <span class="label">02 — Luxury Gold</span>
</div>

<!-- ── Theme 3: Minimal / Black & White ── -->
<div class="card">
  <svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
    <rect width="200" height="200" fill="#ffffff"/>
    <!-- Bold building block -->
    <rect x="72" y="50" width="22" height="90" fill="#111"/>
    <rect x="96" y="38" width="18" height="102" fill="#111"/>
    <rect x="116" y="65" width="16" height="75" fill="#111"/>
    <rect x="58" y="80" width="16" height="60" fill="#111"/>
    <!-- Baseline -->
    <rect x="40" y="140" width="120" height="3" fill="#111"/>
    <!-- AR scan line -->
    <rect x="40" y="100" width="120" height="1.5" fill="#111" opacity="0.2"/>
    <!-- Dot accent -->
    <circle cx="100" cy="28" r="5" fill="#111"/>
    <!-- Text -->
    <text x="100" y="168" text-anchor="middle" fill="#111" font-size="15" font-weight="900" font-family="sans-serif" letter-spacing="5">AR·DOOH</text>
    <text x="100" y="182" text-anchor="middle" fill="#111" font-size="7" font-family="sans-serif" letter-spacing="3" opacity="0.4">NYC LANDMARK DETECTION</text>
  </svg>
  <span class="label">03 — Minimal B&W</span>
</div>

<!-- ── Theme 4: Glitch / Digital ── -->
<div class="card">
  <svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
    <rect width="200" height="200" fill="#050505"/>
    <!-- Glitch offset layers -->
    <path d="M55,145 L55,80 L72,80 L72,60 L80,60 L80,45 L88,45 L88,35 L100,20 L112,35 L112,45 L120,45 L120,60 L128,60 L128,80 L145,80 L145,145 Z"
      fill="none" stroke="#ff003c" stroke-width="1.5" opacity="0.5" transform="translate(-3, 2)"/>
    <path d="M55,145 L55,80 L72,80 L72,60 L80,60 L80,45 L88,45 L88,35 L100,20 L112,35 L112,45 L120,45 L120,60 L128,60 L128,80 L145,80 L145,145 Z"
      fill="none" stroke="#00ff9f" stroke-width="1.5" opacity="0.5" transform="translate(3, -2)"/>
    <!-- Main shape -->
    <path d="M55,145 L55,80 L72,80 L72,60 L80,60 L80,45 L88,45 L88,35 L100,20 L112,35 L112,45 L120,45 L120,60 L128,60 L128,80 L145,80 L145,145 Z"
      fill="#0a0a0a" stroke="#ffffff" stroke-width="2"/>
    <!-- Glitch bars -->
    <rect x="55" y="88" width="90" height="5" fill="#ff003c" opacity="0.5"/>
    <rect x="55" y="112" width="90" height="3" fill="#00ff9f" opacity="0.4"/>
    <!-- Windows -->
    <rect x="78" y="70" width="8" height="8" fill="#fff" opacity="0.8"/>
    <rect x="90" y="70" width="8" height="8" fill="#fff" opacity="0.8"/>
    <rect x="102" y="70" width="8" height="8" fill="#fff" opacity="0.8"/>
    <rect x="114" y="70" width="8" height="8" fill="#fff" opacity="0.8"/>
    <!-- Text with glitch -->
    <text x="103" y="172" text-anchor="middle" fill="#ff003c" font-size="17" font-weight="900" font-family="monospace" letter-spacing="3" opacity="0.7">AR·DOOH</text>
    <text x="97" y="172" text-anchor="middle" fill="#00ff9f" font-size="17" font-weight="900" font-family="monospace" letter-spacing="3" opacity="0.7">AR·DOOH</text>
    <text x="100" y="172" text-anchor="middle" fill="#ffffff" font-size="17" font-weight="900" font-family="monospace" letter-spacing="3">AR·DOOH</text>
  </svg>
  <span class="label">04 — Glitch Digital</span>
</div>

<!-- ── Theme 5: Sunset / Warm Gradient ── -->
<div class="card">
  <svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" style="stop-color:#1a0533"/>
        <stop offset="50%" style="stop-color:#8b1a4a"/>
        <stop offset="100%" style="stop-color:#ff6a1a"/>
      </linearGradient>
      <linearGradient id="sunset-text" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" style="stop-color:#ff6a1a"/>
        <stop offset="100%" style="stop-color:#ffb347"/>
      </linearGradient>
    </defs>
    <rect width="200" height="200" fill="url(#sky)"/>
    <!-- Horizontal glow lines (sunset bands) -->
    <rect x="0" y="120" width="200" height="2" fill="#ff6a1a" opacity="0.5"/>
    <rect x="0" y="128" width="200" height="1" fill="#ff6a1a" opacity="0.3"/>
    <rect x="0" y="134" width="200" height="1" fill="#ff6a1a" opacity="0.2"/>
    <!-- Sun circle -->
    <circle cx="100" cy="120" r="22" fill="#ff6a1a" opacity="0.25"/>
    <circle cx="100" cy="120" r="14" fill="#ffb347" opacity="0.3"/>
    <!-- Skyline silhouette (dark) -->
    <path d="M0,145 L0,110 L25,110 L25,95 L40,95 L40,80 L52,80 L52,65 L58,65 L58,55 L64,55 L64,45 L70,45 L70,38 L74,38 L74,32 L78,32 L78,38 L82,38 L82,55 L88,55 L88,45 L93,45 L93,38 L100,28 L107,38 L107,45 L112,45 L112,55 L118,55 L118,65 L128,65 L128,80 L138,80 L138,95 L152,95 L152,85 L162,85 L162,110 L175,110 L175,95 L200,95 L200,145 Z"
      fill="#0d0020" opacity="0.95"/>
    <!-- Text -->
    <text x="100" y="174" text-anchor="middle" fill="url(#sunset-text)" font-size="17" font-weight="900" font-family="sans-serif" letter-spacing="4">AR·DOOH</text>
    <text x="100" y="188" text-anchor="middle" fill="#ff6a1a" font-size="7" font-family="sans-serif" letter-spacing="3" opacity="0.7">NYC LANDMARKS</text>
  </svg>
  <span class="label">05 — Sunset City</span>
</div>

</body>
</html>
