<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Building Logos</title>
  <style>
    body { background: #080808; font-family: monospace; display: flex; flex-wrap: wrap; gap: 60px; padding: 60px; justify-content: center; }
    .card { display: flex; flex-direction: column; align-items: center; gap: 14px; }
    .label { color: #444; font-size: 11px; letter-spacing: 0.25em; text-transform: uppercase; }
  </style>
</head>
<body>

<!-- ── The Edge — Orange / Geometric ── -->
<div class="card">
  <svg width="220" height="220" viewBox="0 0 220 220" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="edgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" style="stop-color:#ff8c00"/>
        <stop offset="100%" style="stop-color:#ff4500"/>
      </linearGradient>
      <filter id="edgeGlow">
        <feGaussianBlur stdDeviation="2.5" result="blur"/>
        <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
    </defs>
    <rect width="220" height="220" fill="#0c0800"/>

    <!-- Corner brackets -->
    <polyline points="18,45 18,18 45,18" fill="none" stroke="#ff8c00" stroke-width="2" stroke-linecap="square" opacity="0.6"/>
    <polyline points="175,18 202,18 202,45" fill="none" stroke="#ff8c00" stroke-width="2" stroke-linecap="square" opacity="0.6"/>
    <polyline points="18,175 18,202 45,202" fill="none" stroke="#ff8c00" stroke-width="2" stroke-linecap="square" opacity="0.6"/>
    <polyline points="175,202 202,202 202,175" fill="none" stroke="#ff8c00" stroke-width="2" stroke-linecap="square" opacity="0.6"/>

    <!-- The Edge building: tall tower + cantilevered observation deck -->
    <!-- Main tower -->
    <rect x="85" y="48" width="28" height="110" fill="none" stroke="url(#edgeGrad)" stroke-width="2" filter="url(#edgeGlow)"/>
    <!-- Tower fill -->
    <rect x="86" y="49" width="26" height="108" fill="#ff8c00" opacity="0.07"/>
    <!-- Windows on tower -->
    <rect x="91" y="58"  width="7" height="5" fill="#ff8c00" opacity="0.5"/>
    <rect x="101" y="58" width="7" height="5" fill="#ff8c00" opacity="0.5"/>
    <rect x="91" y="70"  width="7" height="5" fill="#ff8c00" opacity="0.5"/>
    <rect x="101" y="70" width="7" height="5" fill="#ff8c00" opacity="0.5"/>
    <rect x="91" y="82"  width="7" height="5" fill="#ff8c00" opacity="0.5"/>
    <rect x="101" y="82" width="7" height="5" fill="#ff8c00" opacity="0.5"/>
    <!-- Cantilever platform (The Edge observation deck) -->
    <rect x="65" y="90" width="68" height="12" fill="none" stroke="url(#edgeGrad)" stroke-width="2.5" filter="url(#edgeGlow)"/>
    <rect x="66" y="91" width="66" height="10" fill="#ff8c00" opacity="0.12"/>
    <!-- Platform support strut -->
    <line x1="85" y1="102" x2="70" y2="115" stroke="#ff8c00" stroke-width="1.5" opacity="0.5"/>
    <line x1="133" y1="102" x2="148" y2="115" stroke="#ff8c00" stroke-width="1.5" opacity="0.5"/>
    <!-- Ground base -->
    <rect x="60" y="158" width="98" height="4" fill="url(#edgeGrad)" opacity="0.6"/>

    <!-- Text -->
    <text x="110" y="182" text-anchor="middle" fill="url(#edgeGrad)" font-size="15" font-weight="900" font-family="monospace" letter-spacing="4" filter="url(#edgeGlow)">THE EDGE</text>
    <text x="110" y="198" text-anchor="middle" fill="#ff8c00" font-size="8" font-family="monospace" letter-spacing="3" opacity="0.5">HUDSON YARDS · NYC</text>
  </svg>
  <span class="label">The Edge</span>
</div>

<!-- ── One WTC — Cyan / Sleek ── -->
<div class="card">
  <svg width="220" height="220" viewBox="0 0 220 220" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="wtcGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" style="stop-color:#ffffff"/>
        <stop offset="40%" style="stop-color:#00f0ff"/>
        <stop offset="100%" style="stop-color:#0066aa"/>
      </linearGradient>
      <filter id="wtcGlow">
        <feGaussianBlur stdDeviation="2" result="blur"/>
        <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
    </defs>
    <rect width="220" height="220" fill="#020c10"/>

    <!-- Subtle grid -->
    <line x1="0"   y1="110" x2="220" y2="110" stroke="#00f0ff" stroke-width="0.4" opacity="0.15"/>
    <line x1="110" y1="0"   x2="110" y2="220" stroke="#00f0ff" stroke-width="0.4" opacity="0.15"/>

    <!-- WTC: octagonal tapered tower -->
    <!-- Tower base -->
    <polygon points="82,158 78,130 86,90 92,62 100,40 108,62 114,90 122,130 118,158"
      fill="#00f0ff" opacity="0.06"/>
    <polygon points="82,158 78,130 86,90 92,62 100,40 108,62 114,90 122,130 118,158"
      fill="none" stroke="url(#wtcGrad)" stroke-width="2" filter="url(#wtcGlow)"/>

    <!-- Antenna spire -->
    <line x1="110" y1="40" x2="110" y2="22" stroke="url(#wtcGrad)" stroke-width="2" filter="url(#wtcGlow)"/>
    <circle cx="110" cy="20" r="2.5" fill="#ffffff" filter="url(#wtcGlow)"/>

    <!-- Horizontal bands (floors) -->
    <line x1="88"  y1="115" x2="132" y2="115" stroke="#00f0ff" stroke-width="0.8" opacity="0.3"/>
    <line x1="85"  y1="130" x2="135" y2="130" stroke="#00f0ff" stroke-width="0.8" opacity="0.3"/>
    <line x1="90"  y1="100" x2="130" y2="100" stroke="#00f0ff" stroke-width="0.8" opacity="0.3"/>

    <!-- Reflection line -->
    <line x1="110" y1="158" x2="110" y2="175" stroke="#00f0ff" stroke-width="1" opacity="0.2" stroke-dasharray="3 3"/>

    <!-- Ground base -->
    <rect x="55" y="158" width="110" height="3" fill="#00f0ff" opacity="0.4"/>
    <rect x="70" y="161" width="80"  height="1.5" fill="#00f0ff" opacity="0.2"/>

    <!-- AR scan bracket -->
    <polyline points="55,50 40,50 40,65"   fill="none" stroke="#00f0ff" stroke-width="1.5" opacity="0.4"/>
    <polyline points="165,50 180,50 180,65" fill="none" stroke="#00f0ff" stroke-width="1.5" opacity="0.4"/>

    <!-- Text -->
    <text x="110" y="182" text-anchor="middle" fill="url(#wtcGrad)" font-size="13" font-weight="900" font-family="monospace" letter-spacing="3" filter="url(#wtcGlow)">ONE WTC</text>
    <text x="110" y="198" text-anchor="middle" fill="#00f0ff" font-size="8" font-family="monospace" letter-spacing="3" opacity="0.5">WORLD TRADE CENTER</text>
  </svg>
  <span class="label">One WTC</span>
</div>

<!-- ── Empire State Building — Gold / Art Deco ── -->
<div class="card">
  <svg width="220" height="220" viewBox="0 0 220 220" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="esbGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" style="stop-color:#ffe066"/>
        <stop offset="50%" style="stop-color:#c9952a"/>
        <stop offset="100%" style="stop-color:#8b5e0a"/>
      </linearGradient>
      <linearGradient id="esbSky" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" style="stop-color:#0a0a18"/>
        <stop offset="100%" style="stop-color:#0e0a04"/>
      </linearGradient>
    </defs>
    <rect width="220" height="220" fill="url(#esbSky)"/>

    <!-- Art deco thin border -->
    <rect x="10" y="10" width="200" height="200" fill="none" stroke="url(#esbGrad)" stroke-width="0.75" opacity="0.4"/>
    <rect x="15" y="15" width="190" height="190" fill="none" stroke="url(#esbGrad)" stroke-width="0.4" opacity="0.2"/>

    <!-- Empire State stepped silhouette -->
    <!-- Base -->
    <rect x="55"  y="140" width="110" height="18" fill="none" stroke="url(#esbGrad)" stroke-width="1.5"/>
    <rect x="56"  y="141" width="108" height="16" fill="#c9952a" opacity="0.08"/>
    <!-- Step 2 -->
    <rect x="68"  y="118" width="84"  height="24" fill="none" stroke="url(#esbGrad)" stroke-width="1.5"/>
    <rect x="69"  y="119" width="82"  height="22" fill="#c9952a" opacity="0.08"/>
    <!-- Step 3 -->
    <rect x="78"  y="100" width="64"  height="20" fill="none" stroke="url(#esbGrad)" stroke-width="1.5"/>
    <!-- Step 4 -->
    <rect x="88"  y="82"  width="44"  height="20" fill="none" stroke="url(#esbGrad)" stroke-width="1.5"/>
    <!-- Step 5 (mooring mast base) -->
    <rect x="96"  y="66"  width="28"  height="18" fill="none" stroke="url(#esbGrad)" stroke-width="1.5"/>
    <!-- Broadcast tower -->
    <rect x="107" y="38"  width="6"   height="28" fill="url(#esbGrad)"/>
    <rect x="108.5" y="28" width="3"  height="12" fill="url(#esbGrad)"/>
    <line x1="110" y1="28" x2="110" y2="20" stroke="url(#esbGrad)" stroke-width="1.5"/>
    <!-- Antenna tip glow -->
    <circle cx="110" cy="19" r="2" fill="#ffe066" opacity="0.9"/>

    <!-- Art deco ornamental lines -->
    <line x1="68"  y1="138" x2="152" y2="138" stroke="url(#esbGrad)" stroke-width="0.75" opacity="0.4"/>
    <line x1="78"  y1="118" x2="142" y2="118" stroke="url(#esbGrad)" stroke-width="0.75" opacity="0.4"/>

    <!-- Windows -->
    <rect x="82"  y="104" width="5" height="6" fill="#ffe066" opacity="0.4"/>
    <rect x="92"  y="104" width="5" height="6" fill="#ffe066" opacity="0.4"/>
    <rect x="123" y="104" width="5" height="6" fill="#ffe066" opacity="0.4"/>
    <rect x="113" y="104" width="5" height="6" fill="#ffe066" opacity="0.4"/>

    <!-- Text -->
    <text x="110" y="178" text-anchor="middle" fill="url(#esbGrad)" font-size="10" font-weight="700" font-family="serif" letter-spacing="5">EMPIRE STATE</text>
    <text x="110" y="193" text-anchor="middle" fill="url(#esbGrad)" font-size="8" font-family="serif" letter-spacing="4" opacity="0.5">BUILDING · 1931</text>
  </svg>
  <span class="label">Empire State Building</span>
</div>

</body>
</html>
